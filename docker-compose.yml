version: '3.8'

services:
  app:
    build: .
    container_name: prompt_studio_app
    ports:
      - "8000:8000"
      - "8501:8501"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_BASE_URL=http://localhost:8000
      - DEFAULT_AI_PROVIDER=mock
    volumes:
      - ./prompts.db:/app/prompts.db
      - ./logs:/app/logs
    restart: unless-stopped
